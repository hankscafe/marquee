name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; the jobs that publish ask for more below.
permissions:
  contents: read

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

  docker:
    name: Build & push container
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is the newest release, set by the tag's own run, so a failed
          # main build can't leave it behind. Main pushes publish `main` instead.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history + tags to build the changelog
      # This repo pushes straight to main (no PRs), so GitHub's auto-generated
      # notes come up empty. Build the changelog from the commit log instead.
      - name: Build release notes from the commit log
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}${GITHUB_REF_NAME}"
          {
            echo "body<<NOTES_EOF"
            # Commit subjects may start with an emoji; release-note titles never do.
            git log --no-merges --pretty='%s' "$range" \
              | grep -v '^Release v' \
              | perl -CS -pe 's/^[\p{Extended_Pictographic}\x{FE0F}\x{200D}\s]+//; s/^/* /' || true
            echo ""
            # Image tags are bare semver (0.6.0), not the git tag (v0.6.0).
            echo "Container image: \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}\`"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
